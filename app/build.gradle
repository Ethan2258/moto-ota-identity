plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "io.github.ethan2258.motootaidentity"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.ethan2258.motootaidentity"
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ["META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            def storePath = providers.environmentVariable("ANDROID_SIGNING_STORE_FILE").orNull
            if (storePath != null) {
                signingConfig signingConfigs.create("releaseSigning") {
                    storeFile rootProject.file(storePath)
                    storePassword providers.environmentVariable("ANDROID_KEYSTORE_PASSWORD").get()
                    keyAlias providers.environmentVariable("ANDROID_KEY_ALIAS").get()
                    keyPassword providers.environmentVariable("ANDROID_KEY_PASSWORD").get()
                }
            }
        }
    }
}

tasks.register("printVersionName") {
    doLast {
        println android.defaultConfig.versionName
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
    implementation platform("androidx.compose:compose-bom:2025.05.01")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3:1.4.0-alpha18"
    implementation "androidx.compose.ui:ui"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}
