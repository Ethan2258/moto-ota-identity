name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/moto-ota-identity-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
      - name: Match tag to app version
        run: |
          APP_VERSION="$(./gradlew --no-daemon -q printVersionName)"
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"
      - name: Test and build signed release
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/MotoOtaIdentity-$GITHUB_REF_NAME.apk"
          cd release
          sha256sum "MotoOtaIdentity-$GITHUB_REF_NAME.apk" > "MotoOtaIdentity-$GITHUB_REF_NAME.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "release/MotoOtaIdentity-$GITHUB_REF_NAME.apk"
          "release/MotoOtaIdentity-$GITHUB_REF_NAME.apk.sha256"
          --verify-tag
          --generate-notes
          --title "Moto OTA Identity $GITHUB_REF_NAME"
